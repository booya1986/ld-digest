name: Sunday digest email

# Sends the weekly L&D digest email from GitHub's cloud, so it goes out even
# when Avi's Mac is off.
on:
  schedule:
    # GitHub's cron is NOT the primary trigger any more, because it cannot
    # promise a time: it fired 41 minutes late on 2026-08-23 and did not fire at
    # all on 2026-08-16. Both weeks the email only went out because a catch-net
    # picked it up. Avi wants the digest at 07:30 Israel time, so the punctual
    # claude.ai routine "Sunday Digest Send" fires first, by pushing
    # .send-trigger (see the push: trigger below). A push starts a workflow
    # immediately instead of queueing it behind GitHub's scheduler.
    #
    # What is left here is a LATE BACKUP. It deliberately starts after 07:30 in
    # BOTH Israeli timezones, so it can rescue a failed send without ever
    # pre-empting the intended delivery time:
    #   06:00 UTC = 09:00 IDT (summer) / 08:00 IST (winter)
    # The per-week .email_sent dedup keeps this to one send regardless of how
    # many times it fires.
    - cron: "0 6-11 * * 0"
  workflow_dispatch: {}
  # External-trigger path: anything with contents:write can fire a real send by
  # pushing to .send-trigger, without needing actions:write.
  push:
    paths:
      - ".send-trigger"

permissions:
  contents: write

concurrency:
  group: sunday-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine latest week
        id: week
        run: |
          week=$(ls reports 2>/dev/null | grep -E '^[0-9]{4}-W[0-9]+$' | sort | tail -1)
          # No report yet (fresh repo, or Friday has never run). There is
          # nothing to send, and that is not a failure: exit cleanly rather
          # than red-flagging the run and mailing a failure notice.
          if [ -z "$week" ]; then
            echo "::notice title=no-report::no report directory yet, nothing to send"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "Latest report week: $week"
          # If the latest report is not the current ISO week, Friday's build
          # probably failed. Say so loudly rather than quietly re-sending an
          # old digest.
          cur=$(python3 -c "import datetime;i=datetime.date.today().isocalendar();print(f'{i[0]}-W{i[1]:02d}')")
          if [ "$week" != "$cur" ]; then
            echo "::warning title=stale::latest report is $week but the current week is $cur -- the Friday run may have failed"
          fi

      - name: Send digest email (SMTP via App Password)
        if: steps.week.outputs.skip == 'false'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Comma separated recipient list, held as a repo variable so the
          # audience changes without a commit. Falls back to Avi alone if the
          # variable is unset.
          DIGEST_TO: ${{ vars.DIGEST_TO }}
        run: python3 scripts/send_digest_smtp.py "${{ steps.week.outputs.week }}"

      - name: Commit dedup marker
        if: steps.week.outputs.skip == 'false'
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          git config user.email "avi.j.levi@gmail.com"
          git config user.name "Avi Levi (GitHub Actions)"

          # Stage each path in its own `git add`, and only when it exists.
          # A single `git add -f a b c` where one path is missing dies with
          # "pathspec did not match any files" and stages NOTHING. In the
          # sibling repo that meant .email_sent never got committed, so every
          # hourly catch-net fire re-sent the digest: 6 copies of one email.
          for f in .email_sent; do
            p="reports/$WEEK/$f"
            [ -e "$p" ] && git add -f "$p"
          done

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Sunday digest: mark $WEEK sent"
            # Retry on a rejected push. The Friday run takes several minutes,
            # and anything landing on main meanwhile rejects this push and
            # discards the whole week's work. Rebase and try again rather than
            # losing the report. Observed 2026-08-22.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing on the remote"
              git pull --rebase --autostash
              if [ "$attempt" = "3" ]; then
                echo "::error title=push::could not push after 3 attempts"
                exit 1
              fi
            done
          fi

          # The dedup marker is the only thing preventing a duplicate send, so
          # failing to persist it is worth shouting about even though the email
          # itself already went out.
          if [ -f "reports/$WEEK/.email_sent" ] && ! git ls-tree -r --name-only HEAD | grep -qx "reports/$WEEK/.email_sent"; then
            echo "::error title=dedup::.email_sent for $WEEK was NOT committed -- the next scheduled fire will re-send this digest"
            exit 1
          fi
